workflows:
  ios-grid-six:
    name: Grid Six iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.gridsix.airsoft"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Adicionar plataforma iOS
        script: npx cap add ios || npx cap sync ios
      - name: Gerar icones automaticamente do icon.png
        script: npx capacitor-assets generate --iconBackgroundColor '#12140F' --iconBackgroundColorDark '#12140F'
      - name: Ajustar permissoes no Info.plist
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'O Grid Six usa sua localizacao para te mostrar no mapa durante a partida.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'O Grid Six usa o microfone para as mensagens de voz do radio (PTT).'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSMotionUsageDescription string 'O Grid Six usa a bussola do aparelho para mostrar sua direcao no mapa.'" $PLIST || true
      - name: Build e assinatura automatica
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
